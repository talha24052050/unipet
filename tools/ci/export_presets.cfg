; CI'da game/export_presets.cfg olarak kopyalanır (yerel dosya .gitignore'da).
; Şifre/anahtar YOK: debug keystore CI'da ortam değişkenleriyle verilir.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, secrets.cfg"
exclude_filter="tests/*"
export_path="../build/unipet-debug.apk"

[preset.0.options]

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="io.github.talha24052050.unipet"
package/name="UniPet"
package/signed=true
screen/immersive_mode=true
permissions/internet=true

[preset.1]

name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, secrets.cfg"
exclude_filter="tests/*"
export_path="../build/ios/UniPet.xcodeproj"

[preset.1.options]

application/app_store_team_id=""
application/bundle_identifier="io.github.talha24052050.unipet"
application/short_version="0.1.0"
application/version="1"
application/export_project_only=true
architectures/arm64=true
orientation/portrait=true
orientation/landscape_left=false
orientation/landscape_right=false
orientation/portrait_upside_down=false
storyboard/use_launch_screen_storyboard=true
icons/app_store_1024x1024="res://assets/icons/ios/icon_1024.png"
icons/iphone_180x180="res://assets/icons/ios/icon_180.png"
icons/iphone_120x120="res://assets/icons/ios/icon_120.png"
icons/ipad_167x167="res://assets/icons/ios/icon_167.png"
icons/ipad_152x152="res://assets/icons/ios/icon_152.png"
icons/ipad_76x76="res://assets/icons/ios/icon_76.png"
icons/spotlight_80x80="res://assets/icons/ios/icon_80.png"
icons/spotlight_40x40="res://assets/icons/ios/icon_40.png"
