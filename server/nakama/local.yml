name: unipet-local

logger:
  level: INFO

runtime:
  js_entrypoint: "index.js"

match:
  # Yeni oda arama listesine bu kadar ms içinde girer (varsayılan 1000: aynı anda girenler ayrı odalara düşüyordu).
  label_update_interval_ms: 100

session:
  token_expiry_sec: 7200

# socket.server_key ve console kimlik bilgileri ortam degiskenlerinden (.env)
# docker-compose entrypoint CLI parametreleri uzerinden dinamik olarak aktarilir.
socket:
  server_key: defaultkey

console:
  port: 7351
  username: admin
  password: password
