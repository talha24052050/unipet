services:
  postgres:
    image: postgres:16-alpine
    container_name: unipet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nakama}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nakama}"]
      interval: 3s
      timeout: 3s
      retries: 5

  nakama:
    image: heroiclabs/nakama:3.26.0
    container_name: unipet-nakama
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-localdb}@postgres:5432/${POSTGRES_DB:-nakama}?sslmode=disable &&
        printf 'runtime:\n  env:\n    - "SUPABASE_URL=%s"\n    - "SUPABASE_ANON_KEY=%s"\n    - "UNIPET_DEV_AUTH=%s"\n    - "UNIPET_ROOM_CAPACITY=%s"\n    - "UNIPET_FREE_CHAT=%s"\n    - "UNIPET_REQUIRE_SCHOOL_EMAIL=%s"\n    - "UNIPET_CLOSED_TEST=%s"\n' "$$SUPABASE_URL" "$$SUPABASE_ANON_KEY" "$$UNIPET_DEV_AUTH" "$$UNIPET_ROOM_CAPACITY" "$$UNIPET_FREE_CHAT" "$$UNIPET_REQUIRE_SCHOOL_EMAIL" "$$UNIPET_CLOSED_TEST" > /tmp/runtime-env.yml &&
        exec /nakama/nakama --config /nakama/data/local.yml --config /tmp/runtime-env.yml --database.address postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-localdb}@postgres:5432/${POSTGRES_DB:-nakama}?sslmode=disable --socket.server_key "$$NAKAMA_SERVER_KEY" --console.username "$$NAKAMA_CONSOLE_USER" --console.password "$$NAKAMA_CONSOLE_PASS" --session.encryption_key "$$NAKAMA_SESSION_KEY" --session.refresh_encryption_key "$$NAKAMA_REFRESH_KEY" --runtime.http_key "$$NAKAMA_HTTP_KEY"
    environment:
      - NAKAMA_SERVER_KEY=${NAKAMA_SERVER_KEY:-unipet-dev-server-key}
      - NAKAMA_CONSOLE_USER=${NAKAMA_CONSOLE_USER:-admin}
      - NAKAMA_CONSOLE_PASS=${NAKAMA_CONSOLE_PASS:-password}
      # Oturum (JWT) imza anahtarları: Nakama varsayılanı herkesçe bilinir → sahte oturumla her hesaba girilir.
      # Yayında deploy/restart.sh rastgele üretir; buradaki değerler sadece yerel geliştirme içindir.
      - NAKAMA_SESSION_KEY=${NAKAMA_SESSION_KEY:-unipet-dev-session-key}
      - NAKAMA_REFRESH_KEY=${NAKAMA_REFRESH_KEY:-unipet-dev-refresh-key}
      - NAKAMA_HTTP_KEY=${NAKAMA_HTTP_KEY:-unipet-dev-http-key}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - UNIPET_DEV_AUTH=${UNIPET_DEV_AUTH:-false}
      - UNIPET_ROOM_CAPACITY=${UNIPET_ROOM_CAPACITY:-40}
      - UNIPET_FREE_CHAT=${UNIPET_FREE_CHAT:-true}
      - UNIPET_REQUIRE_SCHOOL_EMAIL=${UNIPET_REQUIRE_SCHOOL_EMAIL:-false}
      - UNIPET_CLOSED_TEST=${UNIPET_CLOSED_TEST:-false}
    volumes:
      - ./nakama/local.yml:/nakama/data/local.yml:ro
      - ./nakama/modules:/nakama/data/modules:ro
    ports:
      - "7349:7349"
      - "7350:7350"
      - "127.0.0.1:7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
