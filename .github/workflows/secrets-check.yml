name: secrets-check
# Secret'lar var mı ve imza anahtarı şifreyle açılıyor mu? Değerleri ASLA yazdırmaz; sadece var/yok/çalışıyor.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/secrets-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrol
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KU: ${{ secrets.RELEASE_KEYSTORE_USER }}
          KP: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SU: ${{ secrets.SUPABASE_URL }}
          SK: ${{ secrets.SUPABASE_ANON_KEY }}
          NH: ${{ secrets.NAKAMA_HOST }}
          NK: ${{ secrets.NAKAMA_SERVER_KEY }}
        run: |
          for n in KS KU KP SU SK NH NK; do
            if [ -n "${!n}" ]; then echo "::notice title=$n::var"; else echo "::warning title=$n::yok"; fi
          done
          if [ -n "$KS" ] && [ -n "$KP" ]; then
            echo "$KS" | base64 -d > ks.p12 2>/dev/null || { echo "::error title=keystore::base64 çözülemedi"; exit 0; }
            if keytool -list -keystore ks.p12 -storepass "$KP" -alias "${KU:-unipet}" >/dev/null 2>&1; then
              echo "::notice title=keystore::şifre ve alias doğru, anahtar açılıyor"
            else
              echo "::error title=keystore::açılmadı (şifre, alias ya da base64 eksik/yanlış)"
            fi
            rm -f ks.p12
          fi
